<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Emily 🌻</title>

<style>
/* ==============================
   CONFIGURACIÓN GENERAL
============================== */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    color: #5b3500;

    background:
        radial-gradient(
            circle at 50% 20%,
            #fffde7 0%,
            #fff3a6 25%,
            #ffd45c 55%,
            #e7a51a 80%,
            #a96800 100%
        );

    overflow-x: hidden;
}


/* ==============================
   FONDO
============================== */

#sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.petal {
    position: absolute;
    top: -50px;
    opacity: 0.8;

    animation-name: caer;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes caer {

    0% {
        transform:
            translateY(-50px)
            rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 0.9;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(540deg);
        opacity: 0;
    }
}


/* ==============================
   CONTENEDOR PRINCIPAL
============================== */

.page {
    position: relative;
    z-index: 5;

    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 40px 20px 60px;
}


/* ==============================
   TARJETA
============================== */

.card {
    width: min(900px, 100%);

    background: rgba(255, 252, 225, 0.94);

    border: 1px solid rgba(255, 255, 255, 0.8);

    border-radius: 30px;

    padding: 45px 55px;

    box-shadow:
        0 20px 60px rgba(91, 53, 0, 0.25);

    backdrop-filter: blur(8px);

    text-align: center;
}


/* ==============================
   FLORES
============================== */

.flowers {
    font-size: clamp(45px, 7vw, 75px);

    letter-spacing: -8px;

    margin-bottom: 15px;

    animation:
        moverFlores 2.5s ease-in-out infinite alternate;
}

@keyframes moverFlores {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.06);
    }
}


/* ==============================
   TEXTOS
============================== */

.small {
    font-size: clamp(13px, 2vw, 18px);

    letter-spacing: 2px;

    margin-bottom: 8px;
}

.title {
    margin: 5px 0 15px;

    font-size: clamp(48px, 9vw, 85px);

    color: #9b5b00;

    text-shadow:
        2px 3px 0 #fff0a3;
}

.subtitle {
    max-width: 700px;

    margin: 0 auto 25px;

    font-size: clamp(18px, 2.5vw, 24px);

    line-height: 1.6;
}


/* ==============================
   CARTA
============================== */

.letter-container {

    width: 100%;

    max-width: 760px;

    margin: 20px auto;

    padding: 10px;
}

#letter {

    font-size: clamp(17px, 2vw, 21px);

    line-height: 1.8;

    text-align: left;

    white-space: pre-wrap;

    overflow-wrap: break-word;

    word-break: normal;
}


/* ==============================
   FIRMA
============================== */

.signature {

    margin-top: 25px;

    font-size: clamp(20px, 3vw, 27px);

    line-height: 1.5;

    font-style: italic;

    color: #875000;
}


/* ==============================
   BOTONES
============================== */

.buttons {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 25px;
}

button {

    border: none;

    border-radius: 50px;

    padding: 14px 24px;

    min-height: 48px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background: #e5a900;

    color: white;

    box-shadow:
        0 8px 18px rgba(116, 72, 0, 0.25);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

button:hover {

    transform: translateY(-3px);

    box-shadow:
        0 12px 25px rgba(116, 72, 0, 0.3);
}

button:active {

    transform: translateY(0);
}


/* ==============================
   MÚSICA
============================== */

.music {

    margin-top: 18px;

    font-size: 13px;

    opacity: 0.65;
}


/* ==============================
   OCULTAR ELEMENTOS
============================== */

.hidden {
    display: none;
}


/* ==============================
   CONFETI
============================== */

.confetti {

    position: fixed;

    z-index: 20;

    top: 50%;
    left: 50%;

    font-size: 25px;

    pointer-events: none;

    animation:
        explosion 1.8s ease-out forwards;
}

@keyframes explosion {

    0% {

        transform:
            translate(0, 0)
            rotate(0deg);

        opacity: 1;
    }

    100% {

        transform:
            translate(
                calc(var(--x) * 1px),
                calc(var(--y) * 1px)
            )
            rotate(720deg);

        opacity: 0;
    }
}


/* ==============================
   PC
============================== */

@media (min-width: 900px) {

    .page {
        padding-top: 60px;
    }

    .card {
        padding: 50px 70px;
    }

}


/* ==============================
   TABLET
============================== */

@media (max-width: 899px) {

    .card {
        padding: 40px 35px;
    }

}


/* ==============================
   CELULAR
============================== */

@media (max-width: 600px) {

    .page {

        padding:
            20px 12px 40px;
    }

    .card {

        border-radius: 22px;

        padding:
            30px 20px;
    }

    .flowers {

        letter-spacing: -5px;
    }

    #letter {

        font-size: 17px;

        line-height: 1.7;
    }

    .buttons {

        flex-direction: column;

        width: 100%;
    }

    button {

        width: 100%;

        max-width: 320px;
    }

}


/* ==============================
   PANTALLAS PEQUEÑAS
============================== */

@media (max-width: 380px) {

    .card {

        padding:
            25px 16px;
    }

    #letter {

        font-size: 16px;

        line-height: 1.65;
    }

}


/* ==============================
   REDUCIR ANIMACIONES
============================== */

@media (prefers-reduced-motion: reduce) {

    .petal,
    .flowers,
    .confetti {

        animation: none !important;
    }
}

</style>
</head>


<body>

<!-- ==============================
     FONDO DE PÉTALOS
============================== -->

<div id="sky"></div>


<div class="page">

    <!-- ==============================
         PANTALLA INICIAL
    ============================== -->

    <section class="card" id="intro">

        <div class="flowers">
            🌻🌻🌻
        </div>

        <div class="small">
            UNA PEQUEÑA SORPRESA PARA TI
        </div>

        <h1 class="title">
            Emily
        </h1>

        <p class="subtitle">
            Hay flores que se regalan…
            y hay personas que hacen que todo florezca. 💛
        </p>

        <div class="buttons">

            <button
                type="button"
                id="openButton">
                Abrir mi sorpresa 🌻
            </button>

        </div>

        <div class="music">
            ♪ Until I Found You — Stephen Sanchez
        </div>

    </section>


    <!-- ==============================
         CARTA
    ============================== -->

    <section
        class="card hidden"
        id="letterCard">

        <div class="flowers">
            🌻✨🌻
        </div>

        <div class="letter-container">

            <div
                id="letter"
                aria-live="polite">
            </div>

        </div>


        <div class="signature">

            Con cariño,<br>

            <strong>
                Frank
            </strong>

            💛

        </div>


        <div class="buttons">

            <button
                type="button"
                id="celebrateButton">

                Un último detalle 🌻

            </button>


            <button
                type="button"
                id="whatsappButton">

                Compartir por WhatsApp 💬

            </button>

        </div>


        <div class="music">

            ♪ Until I Found You — Stephen Sanchez

        </div>

    </section>

</div>


<script>

/* ==============================
   CREAR PÉTALOS
============================== */

const sky = document.getElementById("sky");

function crearPetalos() {

    const cantidad = 35;

    for (let i = 0; i < cantidad; i++) {

        const petal = document.createElement("div");

        petal.className = "petal";

        petal.textContent =
            Math.random() > 0.5
                ? "🌻"
                : "💛";

        petal.style.left =
            Math.random() * 100 + "vw";

        petal.style.animationDuration =
            (6 + Math.random() * 8) + "s";

        petal.style.animationDelay =
            (-Math.random() * 12) + "s";

        petal.style.fontSize =
            (14 + Math.random() * 22) + "px";

        sky.appendChild(petal);
    }
}

crearPetalos();


/* ==============================
   MENSAJE
============================== */

const mensaje = `Emily,

Hoy quería regalarte flores amarillas, pero pensé que unas flores que duran un instante no eran suficientes para decirte lo que quería.

Así que preparé este pequeño rincón para ti. 🌻

Que estas flores te recuerden que hay personas capaces de iluminar un día simplemente con una sonrisa, y tú eres una de esas personas.

Espero que hoy recibas muchos motivos para sonreír, que tus días estén llenos de momentos bonitos y que nunca te falten razones para sentirte especial.

Y si estas flores lograron sacarte aunque sea una pequeña sonrisa… entonces ya valió la pena preparar esta sorpresa. 💛

Feliz día de las flores amarillas, Emily. 🌻✨`;


/* ==============================
   ELEMENTOS
============================== */

const intro =
    document.getElementById("intro");

const letterCard =
    document.getElementById("letterCard");

const letter =
    document.getElementById("letter");

const openButton =
    document.getElementById("openButton");

const celebrateButton =
    document.getElementById("celebrateButton");

const whatsappButton =
    document.getElementById("whatsappButton");


/* ==============================
   ABRIR CARTA
============================== */

openButton.addEventListener(
    "click",
    function () {

        intro.classList.add("hidden");

        letterCard.classList.remove("hidden");

        letter.textContent = "";

        escribirMensaje();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* ==============================
   EFECTO ESCRITURA
============================== */

function escribirMensaje() {

    let posicion = 0;

    const velocidad = 16;

    function escribir() {

        if (posicion < mensaje.length) {

            letter.textContent +=
                mensaje.charAt(posicion);

            posicion++;

            setTimeout(
                escribir,
                velocidad
            );

        }

    }

    escribir();
}


/* ==============================
   CELEBRACIÓN
============================== */

celebrateButton.addEventListener(
    "click",
    function () {

        for (let i = 0; i < 35; i++) {

            const confetti =
                document.createElement("div");

            confetti.className =
                "confetti";

            confetti.textContent =
                Math.random() > 0.5
                    ? "🌻"
                    : "💛";

            const x =
                Math.random() * 900 - 450;

            const y =
                Math.random() * 700 - 350;

            confetti.style.setProperty(
                "--x",
                x
            );

            confetti.style.setProperty(
                "--y",
                y
            );

            document.body.appendChild(
                confetti
            );

            setTimeout(
                function () {
                    confetti.remove();
                },
                1900
            );

        }

    }
);


/* ==============================
   WHATSAPP
============================== */

whatsappButton.addEventListener(
    "click",
    function () {

        const mensajeWhatsApp =
`🌻💛 Emily, preparé una pequeña sorpresa especialmente para ti.

Espero que estas flores te saquen una sonrisa.

— Frank`;

        const url =
            "https://wa.me/?text=" +
            encodeURIComponent(
                mensajeWhatsApp
            );

        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

    }
);

</script>

</body>
</html>
